name: iOS build and tests
on:
  push:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version; swift --version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Generate project
        run: brew install xcodegen && cd ci-smoke && xcodegen generate
      - name: Build and test
        run: |
          cd ci-smoke
          DEST_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          xcodebuild test -project Smoke.xcodeproj -scheme Smoke -destination "id=$DEST_ID" | tee build.log | grep -E "error:|warning:|Test Case|Test Suite|passed|failed|\*\*" 
