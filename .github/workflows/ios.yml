name: Companion CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    name: Swift examples and packages (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run the examples and compare with the recorded output
        run: tools/run-swift-examples.sh --check
      - name: Start the demonstration API
        run: |
          apt-get update -qq && apt-get install -y -qq nodejs curl > /dev/null
          node --version
          (cd book-api && node server.js > /tmp/api.log 2>&1 &)
          sleep 1 && curl -s http://localhost:8080/health
      - name: Test the Swift packages
        env:
          VERDANT_API_URL: http://localhost:8080/verdant/v1/
        run: |
          for p in $(find . -name Package.swift -not -path "*/.build/*" | grep -v '/Projects/' | sort); do
            d=$(dirname "$p"); echo "::group::$d"; (cd "$d" && swift build && (swift test || [ ! -d Tests ])); echo "::endgroup::"
          done
  apple:
    name: Xcode projects (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version
      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint
      - name: Start the demonstration API
        run: |
          (cd book-api && node server.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          sleep 1 && curl -s http://localhost:8080/health
      - name: Build and test the projects
        run: tools/ci-apple.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
